<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 740" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Balance Engine</title>
  <desc id="desc">An illustrative 60 dollar MON long balanced by a 60 dollar MON short using 40 dollars of collateral.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#27313a"/><stop offset="1" stop-color="#11191f"/></radialGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#c1b3ff"/><stop offset="1" stop-color="#7964e6"/></linearGradient>
  </defs>
  <rect width="840" height="740" rx="32" fill="url(#bg)"/>
  <rect x="20" y="20" width="800" height="700" rx="23" fill="none" stroke="#3a4850"/>
  <text x="55" y="72" fill="#a7b3b6" font-family="monospace" font-size="18" letter-spacing="3">THE BALANCE ENGINE</text>
  <text x="785" y="72" text-anchor="end" fill="#a7b3b6" font-family="monospace" font-size="15">ILLUSTRATIVE</text>
  <circle cx="420" cy="350" r="230" fill="none" stroke="#39474f" stroke-width="2"/>
  <circle cx="420" cy="350" r="208" fill="none" stroke="#344149" stroke-width="26"/>
  <path d="M227 269a208 208 0 0 1 386 0" fill="none" stroke="url(#violet)" stroke-width="26" stroke-linecap="round"/>
  <path d="M227 431a208 208 0 0 0 386 0" fill="none" stroke="#e5b977" stroke-width="26" stroke-linecap="round"/>
  <circle cx="420" cy="350" r="155" fill="#141e25" stroke="#45535a" stroke-width="2"/>
  <circle cx="420" cy="350" r="139" fill="none" stroke="#28353e" stroke-width="1"/>
  <path d="M420 218v37M420 446v36M288 350h36M516 350h36" stroke="#64737b" stroke-width="2"/>
  <path d="M420 258v92" stroke="#eeeae3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="420" cy="350" r="10" fill="#eeeae3"/>
  <text x="420" y="389" text-anchor="middle" fill="#a7b3b6" font-family="monospace" font-size="16" letter-spacing="2">NET MON EXPOSURE</text>
  <text x="420" y="427" text-anchor="middle" fill="#f2f0e8" font-family="Arial,sans-serif" font-size="34" font-weight="700">0.0%</text>
  <text x="230" y="624" fill="#c1b3ff" font-family="monospace" font-size="18">MON LONG · $60</text>
  <text x="610" y="624" text-anchor="end" fill="#e5b977" font-family="monospace" font-size="18">MON SHORT · $60</text>
  <text x="420" y="678" text-anchor="middle" fill="#a7b3b6" font-family="Arial,sans-serif" font-size="17">$40 collateral supports the manager-run short</text>
</svg>
